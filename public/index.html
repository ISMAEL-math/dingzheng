<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>钉正</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="./styles.css?v=textbook-picker-4" />
  <link rel="stylesheet" href="./account.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand-row">
        <a class="brand" href="#home" data-brand-home title="钉正"><img class="brand-mark" src="./assets/brand.svg?v=dingzheng-3" alt=""><span class="brand-name">钉正</span></a>
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="收起侧边栏" aria-expanded="true" title="收起侧边栏"><svg class="sidebar-toggle-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="15" height="15" rx="3"></rect><path d="M7.5 3v14"></path><path class="sidebar-toggle-arrow" d="m13 6.5-3.5 3.5 3.5 3.5"></path></svg></button>
      </div>
      <button class="sidebar-new-chat" id="new-chat" data-new-chat title="新对话（⌘/Ctrl + Shift + O）"><span>＋</span><span class="new-chat-label">新对话</span></button>
      <nav class="nav-list" aria-label="主导航">
        <button class="nav-item active" data-page="home" title="主页"><img class="nav-icon" src="./assets/home.svg" alt=""><span class="nav-label">主页</span></button>
        <button class="nav-item" data-page="grade" title="作业批改"><img class="nav-icon" src="./assets/grade.svg" alt=""><span class="nav-label">作业批改</span></button>
        <button class="nav-item" data-page="library" title="知识库"><img class="nav-icon" src="./assets/library.svg" alt=""><span class="nav-label">知识库</span><span class="nav-count" id="nav-source-count">0</span></button>
        <button class="nav-item" data-page="textbooks" title="教材库"><img class="nav-icon" src="./assets/textbooks.svg" alt=""><span class="nav-label">教材库</span></button>
        <button class="nav-item" data-page="mistakes" title="错题本"><img class="nav-icon" src="./assets/mistakes.svg" alt=""><span class="nav-label">错题本</span><span class="nav-count" id="nav-mistake-count">0</span></button>
      </nav>
      <section class="recent-section"><div class="recent-title">最近对话</div><div id="recent-chats" class="recent-chats"><p class="recent-empty">暂无对话记录</p></div></section>
      <div class="sidebar-bottom">
        <button class="profile" id="profile-menu-toggle" data-profile-toggle aria-expanded="false"><span class="avatar" id="profile-avatar">我</span><span class="profile-copy"><strong id="profile-name">个人账户</strong><small>本地账户</small></span><span class="profile-more">⌄</span></button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar"><div class="breadcrumb"><strong id="crumb-current">主页</strong></div><div class="top-actions"><button class="chat-history-button" data-open-chat-history aria-label="历史对话">历史对话</button><button class="mobile-profile-toggle" data-profile-toggle aria-label="个人账户" aria-expanded="false"><span class="avatar" id="mobile-profile-avatar">我</span></button><button class="new-chat-button" data-new-chat><span>＋</span> 新对话</button></div></header>
      <div id="page-root" class="page-root"></div>
    </main>
  </div>
  <div id="profile-menu" class="profile-menu" hidden></div>
  <input id="camera-capture" type="file" accept="image/*" capture="environment" hidden />
  <input id="textbook-pdf" type="file" accept="application/pdf,.pdf" hidden />
  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <script src="./bootstrap.js" type="module"></script>
</body>
</html>
